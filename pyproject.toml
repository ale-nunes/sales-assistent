[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "researchmind"
version = "0.2.0"
description = "A multi-agent research assistant with RAG, Telegram, Streamlit, and source-grounded reports."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "ResearchMind Contributors" }]
dependencies = [
  "google-genai>=2.31,<3",
  "langgraph>=1.0,<2",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "numpy>=1.26,<2.4",
  "pandas>=2.2,<3",
  "python-dotenv>=1.0,<2",
  "chromadb>=1.0,<2",
  "pypdf>=5.0,<7",
  "streamlit>=1.40,<2",
  "python-telegram-bot>=22,<23",
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "google-api-python-client>=2.150,<3",
  "google-auth-oauthlib>=1.2,<2",
  "google-auth-httplib2>=0.2,<1",
  "tenacity>=9,<10",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "pytest-cov>=6,<8",
  "ruff>=0.9,<1",
  "mypy>=1.14,<2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = []

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
packages = ["researchmind"]
strict = true
warn_unused_configs = true
show_error_codes = true
ignore_missing_imports = true
follow_untyped_imports = false

[tool.coverage.run]
source = ["researchmind"]
branch = true
